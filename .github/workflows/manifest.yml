name: Mettre a jour la liste des fichiers
on:
  workflow_dispatch:
  push:
    paths:
      - 'files/**'
      - 'launcher.config.json'
jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/make-manifest.js ${{ github.repository }}
      - run: |
          git config user.name "pokeslap-bot"
          git config user.email "bot@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Mise a jour de manifest.json"
          git push
