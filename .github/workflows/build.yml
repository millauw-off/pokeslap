name: Construire le launcher
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: PokeSlap-installateur
          path: dist/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v${{ steps.ver.outputs.v }}
          name: Launcher ${{ steps.ver.outputs.v }}
          target_commitish: main
          make_latest: true
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
